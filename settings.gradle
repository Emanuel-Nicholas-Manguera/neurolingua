pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        exclusiveContent {
            forRepository {
                ivy {
                    name = 'VoskModels'
                    url = uri('https://alphacephei.com/vosk/models/')
                    patternLayout { artifact '[artifact]-[revision].[ext]' }
                    metadataSources { artifact() }
                }
            }
            filter { includeModule 'org.vosk.models', 'vosk-model-small-en-us' }
        }
    }
}

rootProject.name = 'Neurolingua'
include ':app'
