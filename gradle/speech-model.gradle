import java.security.MessageDigest

configurations {
    englishSpeechModel {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    englishSpeechModel 'org.vosk.models:vosk-model-small-en-us:0.15@zip'
}

def assetsDir = layout.buildDirectory.dir('generated/englishSpeechAssets')
def modelFolder = 'vosk-model-small-en-us-0.15'
def expectedHash = '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498'

def prepareModel = tasks.register('prepareEnglishSpeechModel', Sync) {
    inputs.property('sha256', expectedHash)
    inputs.files(configurations.englishSpeechModel)
    into assetsDir
    from { zipTree(configurations.englishSpeechModel.singleFile) }
    doFirst {
        def digest = MessageDigest.getInstance('SHA-256')
        configurations.englishSpeechModel.singleFile.eachByte(64 * 1024) { bytes, count ->
            digest.update(bytes, 0, count)
        }
        if (digest.digest().encodeHex().toString() != expectedHash) {
            throw new GradleException('The downloaded English speech model did not match its pinned checksum.')
        }
    }
    doLast {
        // Vosk uses this marker to refresh the unpacked assets after a model change.
        new File(destinationDir, modelFolder + '/uuid').setText(expectedHash, 'UTF-8')
    }
}

android.sourceSets.main.assets.srcDir(assetsDir)
tasks.named('preBuild').configure { dependsOn prepareModel }
